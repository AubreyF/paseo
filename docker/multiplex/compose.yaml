name: ${PASEO_INSTANCE:-paseo-multiplex}

services:
  paseo:
    image: ${PASEO_IMAGE:?Run install.sh first}
    restart: unless-stopped
    init: false
    user: 0:0
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP, CHOWN]
    security_opt: [no-new-privileges:true]
    devices:
      - /dev/net/tun:/dev/net/tun
    tmpfs:
      - /run/tailscale:mode=0700
      - /run/personal-tailscale:mode=0700
    stop_grace_period: 90s
    pids_limit: 4096
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: ${PASEO_MEMORY_LIMIT:-16g}
    # Docker counts RAM plus swap here, preserving a 4 GiB swap allowance.
    memswap_limit: ${PASEO_MEMORY_SWAP_LIMIT:-20g}
    cpus: ${PASEO_CPU_LIMIT:-4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PASEO_INSTANCE: ${PASEO_INSTANCE:?Run install.sh first}
      PASEO_PASSWORD: ${PASEO_PASSWORD:?Set PASEO_PASSWORD in .env}
      MTPLX_API_KEY: ${MTPLX_API_KEY:-}
    volumes:
      - ${PASEO_DATA_ROOT:-./data}/home:/home/paseo
      - ${PASEO_WORKSPACE_ROOT:-./workspace}:/workspace
      - tailscale-state:/var/lib/tailscale

volumes:
  tailscale-state:
    name: ${PASEO_INSTANCE:?Run install.sh first}-tailscale
