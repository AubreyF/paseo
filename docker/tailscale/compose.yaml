services:
  paseo:
    image: ${PASEO_TAILSCALE_IMAGE:?Set the tested image reference}
    init: false
    user: 0:0
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETUID
      - SETGID
      - SETPCAP
      - CHOWN
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-hostname:/etc/personal-tailscale/hostname:ro
    tmpfs:
      - /run/tailscale:mode=0700
      - /run/personal-tailscale:mode=0700
    stop_grace_period: 90s
volumes:
  tailscale-state:
    name: ${PASEO_TAILSCALE_VOLUME:?Set the existing identity volume name}
    external: true
